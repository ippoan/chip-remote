[package]
name = "chip-core"
version = "0.1.0"
description = "chip-remote agent: config, WS protocol types and chip matching (platform independent)"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# connect code (base64url) for the phone QR. Already in the tree through tauri / reqwest.
base64 = "0.22"
