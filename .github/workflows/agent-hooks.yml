name: agent-hooks

on:
  pull_request:
    paths:
      - "hooks/**"
      - ".github/workflows/agent-hooks.yml"
  push:
    branches: [main]
    paths:
      - "hooks/**"
      - ".github/workflows/agent-hooks.yml"

permissions:
  contents: read

concurrency:
  group: agent-hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks-linux:
    name: hooks (bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          shellcheck --version | head -n 2
          jq --version

      - name: shellcheck
        run: shellcheck hooks/*.sh hooks/test/*.sh

      - name: hook tests
        run: bash hooks/test/run.sh

  hooks-windows:
    name: hooks (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 reads BOM-less UTF-8 as ANSI, so .ps1 must be pure ASCII.
      - name: ASCII + parse check
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem hooks -Recurse -Include *.ps1) {
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { Write-Host "::error file=$($f.FullName)::non-ASCII byte"; $bad++ }
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) { Write-Host "::error file=$($f.FullName)::$($errs[0].Message)"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad problem(s)" }

      - name: Windows hook tests
        run: .\hooks\test\run-windows.ps1
